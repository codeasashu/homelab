name: homelab

# ─────────────────────────────────────────────────────────────────────────────
# Access model (see .env / .env.example):
#   Daily driver is LAN-by-IP  →  http://${LAN_IP:-192.168.1.12}:<port>   (static 192.168.1.12)
#   Canonical identity for origin-bound services (pocket-id passkeys, Seafile,
#   Jellyfin) is the OWNED domain ${PUBLIC_DOMAIN:-codeasashu.in.eu.org} — stable across Tailscale/
#   Headscale renames. Point that domain at the LAN IP / VPS / Headscale via DNS
#   without ever editing this file.
#   Nothing here depends on a specific Tailscale MagicDNS name.
# ─────────────────────────────────────────────────────────────────────────────

networks:
  homelab_net:
    name: homelab_net
    driver: bridge

volumes:
  model-cache:

services:
  homepage:
    image: ghcr.io/gethomepage/homepage:v1.13.2
    container_name: homepage
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./homepage:/app/config
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      HOMEPAGE_ALLOWED_HOSTS: ${PUBLIC_DOMAIN:-codeasashu.in.eu.org},${LAN_IP:-192.168.1.12}:3000,localhost:3000,homepage:3000
    networks:
      - homelab_net
    labels:
      - homepage.group=🛠 Infrastructure
      - homepage.name=Homepage
      - homepage.icon=homepage.png
      - homepage.href=https://${PUBLIC_DOMAIN:-codeasashu.in.eu.org}
      - homepage.description=Dashboard

  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    restart: unless-stopped
    volumes:
      - ./uptime_kuma:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "3001:3001"
    networks:
      - homelab_net
    labels:
      - homepage.group=🛠 Infrastructure
      - homepage.name=Uptime Kuma
      - homepage.icon=uptime-kuma.png
      - homepage.href=http://${LAN_IP:-192.168.1.12}:3001
      - homepage.description=Monitoring

  nginx:
    image: nginx:alpine
    container_name: homelab-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    networks:
      - homelab_net

  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    volumes:
      - ${IMMICH_UPLOAD_LOCATION}:/data
      - /etc/localtime:/etc/localtime:ro
      - /mnt/primary/Memories:/mnt/primary/Memories:ro
    env_file:
      - .env
    ports:
      - "2283:2283"
    depends_on:
      - redis
      - database
    restart: always
    healthcheck:
      disable: false
    networks:
      - homelab_net
    labels:
      - homepage.group=📸 Family
      - homepage.name=Immich
      - homepage.icon=immich.png
      - homepage.href=http://${LAN_IP:-192.168.1.12}:2283
      - homepage.description=Photos & Videos
      - homepage.widget.type=immich
      - homepage.widget.url=http://immich-server:2283
      - homepage.widget.key=${HOMEPAGE_IMMICH_API_KEY}
      - homepage.widget.version=2

  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    volumes:
      - model-cache:/cache
    env_file:
      - .env
    restart: always
    healthcheck:
      disable: false
    networks:
      - homelab_net

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9@sha256:fb8d272e529ea567b9bf1302245796f21a2672b8368ca3fcb938ac334e613c8f
    healthcheck:
      test: redis-cli ping || exit 1
    restart: always
    networks:
      - homelab_net

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD}
      POSTGRES_USER: ${IMMICH_DB_USERNAME}
      POSTGRES_DB: ${IMMICH_DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      # Do not edit the next line. If you want to change the database storage location on your system, edit the value of DB_DATA_LOCATION in the .env file
      - ${IMMICH_DB_DATA_LOCATION}:/var/lib/postgresql/data
    shm_size: 128mb
    restart: always
    networks:
      - homelab_net

  mariadb:
    image: mariadb:10.11
    container_name: seafile-mysql
    environment:
      - MARIADB_ROOT_PASSWORD=${INIT_SEAFILE_MYSQL_ROOT_PASSWORD:-}
      - MYSQL_LOG_CONSOLE=true
      - MARIADB_AUTO_UPGRADE=1
      - MARIADB_USER=seafile
      - MARIADB_PASSWORD=${SEAFILE_MYSQL_DB_PASSWORD:?Variable is not set or empty}
    volumes:
      - ./seafile/mysql:/var/lib/mysql # Required, specifies the path to MySQL data persistent store.
    networks:
      - homelab_net
    healthcheck:
      test:
        [
          "CMD",
          "/usr/local/bin/healthcheck.sh",
          "--connect",
          "--mariadbupgrade",
          "--innodb_initialized",
        ]
      interval: 20s
      start_period: 30s
      timeout: 5s
      retries: 10

  seafile:
    image: seafileltd/seafile-mc:13.0-latest
    container_name: seafile
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - /mnt/primary/seafile/shared:/shared # Required, specifies the path to Seafile data persistent store.
    environment:
      - SEAFILE_MYSQL_DB_HOST=mariadb
      - SEAFILE_MYSQL_DB_PORT=3306
      - SEAFILE_MYSQL_DB_USER=root
      - SEAFILE_MYSQL_DB_PASSWORD=${INIT_SEAFILE_MYSQL_ROOT_PASSWORD:?Variable is not set or empty}
      - INIT_SEAFILE_MYSQL_ROOT_PASSWORD=${INIT_SEAFILE_MYSQL_ROOT_PASSWORD:-}
      - SEAFILE_MYSQL_DB_CCNET_DB_NAME=ccnet_db
      - SEAFILE_MYSQL_DB_SEAFILE_DB_NAME=seafile_db
      - SEAFILE_MYSQL_DB_SEAHUB_DB_NAME=seahub_db
      - TIME_ZONE=${TZ:-Asia/Kolkata}
      - INIT_SEAFILE_ADMIN_EMAIL=${INIT_SEAFILE_ADMIN_EMAIL:-me@example.com}
      - INIT_SEAFILE_ADMIN_PASSWORD=${INIT_SEAFILE_ADMIN_PASSWORD:-asecret}
      - SEAFILE_SERVER_HOSTNAME=${SEAFILE_SERVER_HOSTNAME:?Variable is not set or empty}
      - SEAFILE_SERVER_PROTOCOL=${SEAFILE_SERVER_PROTOCOL:-https}
      - SITE_ROOT=/
      - NON_ROOT=false
      - JWT_PRIVATE_KEY=${SEAFILE_JWT_PRIVATE_KEY:?Variable is not set or empty}
      - SEAFILE_LOG_TO_STDOUT=${SEAFILE_LOG_TO_STDOUT:-true}
      - ENABLE_GO_FILESERVER=${ENABLE_GO_FILESERVER:-true}
      - ENABLE_SEAFDAV=${ENABLE_SEAFDAV:-false}
      - SEAFDAV_WORKERS=${SEAFDAV_WORKERS:-5}
      - ENABLE_SEADOC=${ENABLE_SEADOC:-true}
      - SEADOC_SERVER_URL=${SEAFILE_SERVER_PROTOCOL:-http}://${SEAFILE_SERVER_HOSTNAME:?Variable is not set or empty}/sdoc-server
      - CACHE_PROVIDER=redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ENABLE_NOTIFICATION_SERVER=${ENABLE_NOTIFICATION_SERVER:-false}
      - INNER_NOTIFICATION_SERVER_URL=${INNER_NOTIFICATION_SERVER_URL:-http://notification-server:8083}
      - NOTIFICATION_SERVER_URL=${NOTIFICATION_SERVER_URL:-${SEAFILE_SERVER_PROTOCOL:-http}://${SEAFILE_SERVER_HOSTNAME:?Variable is not set or empty}/notification}
      - ENABLE_SEAFILE_AI=${ENABLE_SEAFILE_AI:-false}
      - ENABLE_FACE_RECOGNITION=${ENABLE_FACE_RECOGNITION:-false}
      - SEAFILE_AI_SERVER_URL=${SEAFILE_AI_SERVER_URL:-http://seafile-ai:8888}
      - SEAFILE_AI_SECRET_KEY=${SEAFILE_JWT_PRIVATE_KEY:?Variable is not set or empty}
      - ENABLE_METADATA_MANAGEMENT=${ENABLE_METADATA_MANAGEMENT:-false}
      - INNER_METADATA_SERVER_URL=${INNER_METADATA_SERVER_URL:-http://seafile-md-server:8084}
      - MD_FILE_COUNT_LIMIT=${MD_FILE_COUNT_LIMIT:-100000}
      - CSRF_TRUSTED_ORIGINS=${PUBLIC_DOMAIN:-codeasashu.in.eu.org},${LAN_IP:-192.168.1.12}:3000,${SEAFILE_CSRF_TRUSTED_ORIGINS},localhost:3000,homepage:3000
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - homelab_net
    labels:
      - homepage.group=📸 Family
      - homepage.name=Seafile
      - homepage.icon=seafile.png
      - homepage.href=http://${LAN_IP:-192.168.1.12}:8081
      - homepage.description=Documents & Files

  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "4533:4533"
    restart: unless-stopped
    networks:
      - homelab_net
    environment:
      ND_BACKUP_PATH: /data/backup
      ND_BACKUP_SCHEDULE: "0 1 * * *"
      ND_BACKUP_COUNT: 3
    volumes:
      - "./navidrome:/data:z"
      - "/mnt/primary/Music:/music:ro"
    labels:
      - homepage.group=🎬 Media
      - homepage.name=Navidrome
      - homepage.icon=navidrome.png
      - homepage.href=http://${LAN_IP:-192.168.1.12}:4533
      - homepage.description=Music Streaming

  jellyfin:
    image: jellyfin/jellyfin:10.11.11
    container_name: jellyfin
    user: "${PUID:-1000}:${PGID:-1000}"
    devices:
      - /dev/dri:/dev/dri
    ports:
      - 8096:8096/tcp
      - 7359:7359/udp
    volumes:
      - ./jellyfin/config:/config
      - ./jellyfin/cache:/cache
      - type: bind
        source: /mnt/primary/Movies
        target: /movies
      - type: bind
        source: /mnt/primary/Series
        target: /shows
        read_only: true
      # - type: bind
      #   source: /mnt/primary/Personal
      #   target: /personal
      #   read_only: true
      # - type: bind
      #   source: /mnt/primary/torrents
      #   target: /torrents
      #   read_only: true
    restart: "unless-stopped"
    # Optional - alternative address used for autodiscovery
    environment:
      - JELLYFIN_PublishedServerUrl=https://media.${PUBLIC_DOMAIN:-codeasashu.in.eu.org}
    networks:
      - homelab_net
    labels:
      - homepage.group=🎬 Media
      - homepage.name=Jellyfin
      - homepage.icon=jellyfin.png
      - homepage.href=https://media.${PUBLIC_DOMAIN:-codeasashu.in.eu.org}
      - homepage.description=Movies & TV Shows
      - homepage.widget.type=jellyfin
      - homepage.widget.url=http://jellyfin:8096
      - homepage.widget.key=${HOMEPAGE_JELLYFIN_API_KEY}
      - homepage.widget.version=2
      - homepage.widget.enableBlocks=true
      - homepage.widget.enableNowPlaying=true
      - homepage.widget.enableMediaControl=true
      - homepage.widget.showEpisodeNumber=true
      - homepage.widget.expandOneStreamToTwoRows=true

  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.17
    container_name: sonarr
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      - TZ=${TZ:-Asia/Kolkata}
    volumes:
      - ./sonarr:/config
      - /mnt/primary:/data
    ports:
      - "8989:8989"
    restart: unless-stopped
    networks:
      - homelab_net
    labels:
      - homepage.group=⬇️ Automation
      - homepage.name=Sonarr
      - homepage.icon=sonarr.png
      - homepage.href=http://${LAN_IP:-192.168.1.12}:8989
      - homepage.description=TV Automation

  radarr:
    image: lscr.io/linuxserver/radarr:6.2.1
    container_name: radarr
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      - TZ=${TZ:-Asia/Kolkata}
    volumes:
      - ./radarr:/config
      - /mnt/primary:/data
    ports:
      - "7878:7878"
    restart: unless-stopped
    networks:
      - homelab_net
    labels:
      - homepage.group=⬇️ Automation
      - homepage.name=Radarr
      - homepage.icon=radarr.png
      - homepage.href=http://${LAN_IP:-192.168.1.12}:7878
      - homepage.description=Movie Automation

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.2.2
    container_name: qbittorrent
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      - TZ=${TZ:-Asia/Kolkata}
      - WEBUI_PORT=8080
    volumes:
      - ./qbittorrent:/config
      - /mnt/primary/Downloads:/data/Downloads
    ports:
      - "8080:8080"
      - "6881:6881"
      - "6881:6881/udp"
    restart: unless-stopped
    networks:
      - homelab_net
    labels:
      - homepage.group=⬇️ Automation
      - homepage.name=qBittorrent
      - homepage.icon=qbittorrent.png
      - homepage.href=http://${LAN_IP:-192.168.1.12}:8080
      - homepage.description=Downloads

  backrest:
    image: ghcr.io/garethgeorge/backrest:v1.13.0-alpine
    container_name: backrest
    hostname: backrest
    volumes:
      - ./backrest/data:/data
      - ./backrest/config:/config
      - ./backrest/cache:/cache
      - ./backrest/tmp:/tmp
      - ./backrest/rclone:/root/.config/rclone # Mount for rclone config (needed when using rclone remotes)

      - /mnt/primary/immich:/userdata/immich:ro
      - /mnt/primary/Memories:/userdata/memories:ro
      - /mnt/primary/Books:/userdata/books:ro
      - /mnt/primary/docs:/userdata/docs:ro
      - /mnt/primary/seafile:/userdata/seafile:ro
      - /home/ashutosh/homelab:/userdata/homelab:ro

      - /mnt/backup:/repos # Mount local repos (optional for remote storage)
    environment:
      - BACKREST_DATA=/data
      - BACKREST_CONFIG=/config/config.json
      - XDG_CACHE_HOME=/cache
      - TMPDIR=/tmp
      - TZ=${TZ:-Asia/Kolkata}
      - RESTIC_REPOSITORY=/backup/restic
      - RESTIC_PASSWORD=${RESTIC_PASSWORD}
    ports:
      - "9898:9898"
    restart: unless-stopped
    networks:
      - homelab_net
    labels:
      - homepage.group=🛠 Infrastructure
      - homepage.name=Backrest
      - homepage.icon=restic.png
      - homepage.href=http://${LAN_IP:-192.168.1.12}:9898
      - homepage.description=Nightly Backups

  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PG_PASS:-postgres}
    healthcheck:
      interval: 30s
      retries: 5
      start_period: 20s
      test:
        - CMD-SHELL
        - pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    networks:
      - homelab_net

  linkwarden:
    image: ghcr.io/linkwarden/linkwarden:v2.14.1
    container_name: linkwarden
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://postgres:${PG_PASS:-postgres}@postgres:5432/linkwarden
    restart: always
    ports:
      - 3002:3000
    volumes:
      - ./linkwarden:/data/data
    depends_on:
      - postgres
      - meilisearch
    networks:
      - homelab_net
    labels:
      - homepage.group=⬇️ Utility
      - homepage.name=LinkWarden
      - homepage.icon=linkwarden.png
      - homepage.href=http://${LAN_IP:-192.168.1.12}:3002
      - homepage.description=Bookmark

  meilisearch:
    image: getmeili/meilisearch:v1.12.8
    container_name: meilisearch
    restart: always
    env_file:
      - .env
    volumes:
      - ./meilisearch:/meili_data
    networks:
      - homelab_net

  calibre-web-automated:
    image: crocodilestick/calibre-web-automated:v4.0.6
    container_name: calibre-web-automated
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Asia/Kolkata}
      # Hardcover API Key required for Hardcover as a Metadata Provider, get one here: https://docs.hardcover.app/api/getting-started/
      - HARDCOVER_TOKEN=${HARDCOVER_API_TOKEN}
    volumes:
      # CW users migrating should stop their existing CW instance, make a copy of the config folder, and bind that here to carry over all of their user settings ect.
      - ./calibre/config:/config
      - ./calibre/ingest:/cwa-book-ingest
      - ./calibre/plugins:/config/.config/calibre/plugins
      - /mnt/primary/Books/Calibre:/calibre-library
    ports:
      - 8083:8083
    restart: unless-stopped
    networks:
      - homelab_net
    labels:
      - homepage.group=⬇️ Reading
      - homepage.name=Calibre
      - homepage.icon=calibre.png
      - homepage.href=http://${LAN_IP:-192.168.1.12}:8083
      - homepage.description=Reader

  pocket-id:
    image: ghcr.io/pocket-id/pocket-id:v2
    container_name: pocket-id
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - ENCRYPTION_KEY=${POCKETID_ENCRYPTION_KEY:-CHANGE_ME_TO_A_LONG_RANDOM_STRING}
      # WebAuthn/passkeys are bound to this exact origin — keep it on the owned
      # domain so it survives Tailscale/Headscale renames. Changing it forces
      # every passkey to be re-registered.
      - APP_URL=https://pocketid.${PUBLIC_DOMAIN:-codeasashu.in.eu.org}
    ports:
      - 1411:1411
    volumes:
      - "./pocketid/data:/app/data"
    healthcheck:
      test: ["CMD", "/app/pocket-id", "healthcheck"]
      interval: 1m30s
      timeout: 5s
      retries: 2
      start_period: 10s
    networks:
      - homelab_net
